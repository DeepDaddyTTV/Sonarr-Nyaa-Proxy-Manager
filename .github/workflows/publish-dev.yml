name: Publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test proxy and manager
        run: python -m unittest discover -q
      - name: Check manager scripts
        run: |
          node --check app.js
          node --check auth.js
          node --check site-icon.js
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/deepdaddyttv/sonarr-proxy-manager:dev
            ghcr.io/deepdaddyttv/sonarr-proxy-manager:latest
            ghcr.io/deepdaddyttv/sonarr-proxy-manager:build-${{ github.run_number }}
