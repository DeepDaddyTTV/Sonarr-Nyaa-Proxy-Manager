name: Publish development image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test proxy and manager
        run: python -m unittest -q test_nyaa_proxy_runtime_patch test_manager_server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/deepdaddyttv/sonarr-nyaa-proxy-manager:dev
            ghcr.io/deepdaddyttv/sonarr-nyaa-proxy-manager:sha-${{ github.sha }}
