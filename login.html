<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171818" />
    <title>Sign in | Sonarr Proxy Manager</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/manager/styles.css" />
    <script src="/manager/site-icon.js" defer></script>
    <script src="/manager/auth.js" defer></script>
  </head>
  <body class="auth-page">
    <header class="topbar">
      <a class="brand" href="/manager/login" aria-label="Sonarr Proxy Manager sign in"><span class="brand-symbol"><span class="ui-icon icon-brand" aria-hidden="true"></span></span><span><strong>Sonarr Proxy</strong><small>Manager</small></span></a>
      <button class="utility-button" id="themeToggle" type="button" aria-label="Switch to light mode"><span class="ui-icon" id="themeIcon" aria-hidden="true"></span><span id="themeLabel">Light</span></button>
    </header>
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="signInTitle">
        <span class="auth-symbol"><span class="ui-icon icon-brand" aria-hidden="true"></span></span>
        <p class="overline">Sonarr Proxy Manager</p>
        <h1 id="signInTitle">Sign in</h1>
        <p class="auth-intro">Your release rules, all in one place.</p>
        <form id="loginForm" class="auth-form">
          <label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus />
          <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required />
          <p class="auth-error" id="loginError" role="alert" hidden></p>
          <button class="button button-primary auth-submit" id="loginButton" type="submit"><span class="ui-icon icon-login" aria-hidden="true"></span><span id="loginButtonLabel">Sign in</span></button>
        </form>
        <p class="auth-note">Use the administrator credentials for this manager.</p>
      </section>
    </main>
  </body>
</html>
